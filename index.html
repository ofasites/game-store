<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One For All Game Service</title>
<style>
  :root {
    --bg: #0b0d14;
    --panel: #141826;
    --panel2: #1b2133;
    --text: #e8ebf5;
    --muted: #8b93ad;
    --accent: #7c5cff;
    --accent2: #00e0b8;
    --border: #262d44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at top, #151a2e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(11,13,20,0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: 1px; color: var(--accent2); }
  .logo span { color: var(--accent); }
  .search { flex: 1; min-width: 200px; }
  .search input {
    width: 100%; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text); font-size: 15px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .controls { display: flex; gap: 10px; align-items: center; }
  select, .cur-btn {
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px; cursor: pointer;
  }
  .cur-btn { font-weight: 700; color: var(--accent2); }
  .cur-btn:hover { border-color: var(--accent2); }
  .hero { text-align: center; padding: 48px 20px 20px; }
  .hero h1 { font-size: clamp(28px, 5vw, 46px); margin-bottom: 8px; }
  .hero p { color: var(--muted); }
  .cats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 20px; }
  .cat {
    padding: 8px 18px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .cat:hover { color: var(--text); }
  .cat.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .grid {
    max-width: 1200px; margin: 0 auto; padding: 10px 24px 60px;
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .card .img {
    height: 140px; display: flex; align-items: center; justify-content: center;
    font-size: 44px; background: linear-gradient(135deg, var(--panel2), #0f1322);
  }
  .card .img img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 14px; }
  .card h3 { font-size: 16px; margin-bottom: 6px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag {
    font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: var(--panel2); color: var(--muted);
  }
  .price { font-size: 18px; font-weight: 800; color: var(--accent2); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; grid-column: 1 / -1; }
  footer { text-align: center; color: var(--muted); padding: 30px; border-top: 1px solid var(--border); font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="logo">ONE<span>FORALL</span></div>
  <div class="search"><input id="search" type="text" placeholder="Search games..."></div>
  <div class="controls">
    <select id="sort">
      <option value="default">Sort: Featured</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
      <option value="az">Name: A to Z</option>
    </select>
    <button class="cur-btn" id="currency" title="Switch currency">THB</button>
  </div>
</header>

<section class="hero">
  <h1>Game Keys &amp; Accounts</h1>
  <p>Browse by category, search, and compare prices.</p>
</section>

<div class="cats" id="cats"></div>
<div class="count" id="count"></div>
<main class="grid" id="grid"></main>

<footer>&copy; One For All Game Service</footer>

<script>
  // ====== SETTINGS YOU CAN EDIT ======
  // How many Myanmar kyat equal 1 Thai baht. Change this when the rate changes.
  const MMK_PER_THB = 60;

  // Add games here. Prices are in baht (THB).
  // image: leave "" to show the emoji instead, or put a picture link/file name.
  const GAMES = [
    { title: "Cyber Strike 2077", category: "Action",   platform: "PC Key",       price: 890,  emoji: "🔫", image: "" },
    { title: "Dragon Realm Online", category: "RPG",     platform: "Account",      price: 450,  emoji: "🐉", image: "" },
    { title: "Football Legends 26", category: "Sports",  platform: "PlayStation Key", price: 1290, emoji: "⚽", image: "" },
    { title: "Shadow Ops Arena",   category: "Action",   platform: "Steam Key",    price: 590,  emoji: "🎯", image: "" },
    { title: "Kingdom Builder",    category: "Strategy", platform: "PC Key",       price: 320,  emoji: "🏰", image: "" },
    { title: "Speed Rush GT",      category: "Racing",   platform: "Xbox Key",     price: 990,  emoji: "🏎️", image: "" },
    { title: "Mystic Quest Saga",  category: "RPG",      platform: "Steam Key",    price: 750,  emoji: "🧙", image: "" },
    { title: "Battle Royale Max",  category: "Action",   platform: "Account",      price: 250,  emoji: "💥", image: "" },
    { title: "Farm Valley Life",   category: "Casual",   platform: "PC Key",       price: 180,  emoji: "🌾", image: "" },
    { title: "Galaxy Commander",   category: "Strategy", platform: "Steam Key",    price: 640,  emoji: "🚀", image: "" }
  ];
  // ====== END OF SETTINGS ======

  let currency = localStorage.getItem("currency") || "THB";
  let activeCat = "All";

  const $ = id => document.getElementById(id);

  function fmt(thb) {
    if (currency === "THB") return "฿" + thb.toLocaleString();
    return Math.round(thb * MMK_PER_THB).toLocaleString() + " Ks";
  }

  function buildCats() {
    const cats = ["All", ...new Set(GAMES.map(g => g.category))];
    $("cats").innerHTML = cats.map(c =>
      `<button class="cat ${c === activeCat ? "active" : ""}" data-c="${c}">${c}</button>`
    ).join("");
    document.querySelectorAll(".cat").forEach(b => {
      b.onclick = () => { activeCat = b.dataset.c; buildCats(); render(); };
    });
  }

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const sort = $("sort").value;
    let list = GAMES.filter(g =>
      (activeCat === "All" || g.category === activeCat) &&
      (g.title + " " + g.category + " " + g.platform).toLowerCase().includes(q)
    );
    if (sort === "low") list.sort((a, b) => a.price - b.price);
    if (sort === "high") list.sort((a, b) => b.price - a.price);
    if (sort === "az") list.sort((a, b) => a.title.localeCompare(b.title));

    $("count").textContent = list.length + " game" + (list.length === 1 ? "" : "s") + " found";
    $("grid").innerHTML = list.length ? list.map(g => `
      <div class="card">
        <div class="img">${g.image ? `<img src="${g.image}" alt="${g.title}">` : g.emoji}</div>
        <div class="body">
          <h3>${g.title}</h3>
          <div class="tags"><span class="tag">${g.category}</span><span class="tag">${g.platform}</span></div>
          <div class="price">${fmt(g.price)}</div>
        </div>
      </div>`).join("") : `<div class="empty">No games match your search.</div>`;
  }

  $("search").oninput = render;
  $("sort").onchange = render;
  $("currency").onclick = () => {
    currency = currency === "THB" ? "MMK" : "THB";
    localStorage.setItem("currency", currency);
    $("currency").textContent = currency;
    render();
  };

  $("currency").textContent = currency;
  buildCats();
  render();
</script>
</body>
</html>
