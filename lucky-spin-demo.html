'+h.code);}};li.append(b);const exp=document.createElement('small');exp.textContent='Expires '+date(h.expires);li.append(exp);}el('lsHistory').append(li);});}
async function load(){busy=true;if(state)render();try{const j=await api('lucky-status');state=j.lucky;message(state.active?'Your daily gift is ready.':'The next Lucky Spin event is not open yet.');}catch(e){message(e.message);}finally{busy=false;render();}}
